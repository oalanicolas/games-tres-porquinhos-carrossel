<body>
<canvas id="palco" aria-label="Livro-carrossel em três dimensões"></canvas>

<header class="pilula titulo" id="titulo">
  <strong>Os Três Porquinhos</strong>
  <span>conto popular · livro-carrossel</span>
</header>
<div class="pilula capitulo" id="capitulo" hidden>
  <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="#f2a93b"/><circle id="fase" cx="10" cy="10" r="7" fill="#463325"/></svg>
  <span id="capitulo-texto"></span>
</div>

<section class="abertura" id="abertura">
  <h1>Não, não<br>e não!</h1>
  <p>O conto inteiro do Lobo e dos três irmãos num livro pop-up em carrossel: oito cenas que ficam em pé em forma de estrela. Abra, gire e trabalhe o papel.</p>
</section>

<a class="assinatura" href="https://x.com/oalanicolas" target="_blank" rel="noopener">© 2026 Alan Nicolas</a>

<nav class="pilula barra" id="barra" aria-label="Navegação do livro">
  <button class="seta" id="anterior" aria-label="Cena anterior"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
  <div class="pontos" id="pontos" role="tablist" aria-label="Cenas"></div>
  <div class="legenda" aria-live="polite"><strong id="cena-titulo"></strong><span id="cena-sub"></span></div>
  <button class="icone" id="olhar" aria-label="Só olhar: esconder os controles" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M1.5 10S5 4 10 4s8.500 6 8.500 6-3.500 6-8.500 6-8.500-6-8.500-6Z"/><circle cx="10" cy="10" r="2.700"/></svg></button>

  <button class="acao" id="acao"></button>
  <button class="seta" id="proxima" aria-label="Próxima cena"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
</nav>

<button class="pilula voltar-olhar" id="voltar-olhar" hidden>Mostrar controles</button>

<div class="lupa" id="lupa" hidden><svg viewBox="0 0 24 24"><circle cx="10.500" cy="10.500" r="6"/><path d="m15 15 5 5"/></svg></div>
<article class="cartao" id="cartao" hidden></article>

<div class="carregando" id="carregando"><span>Dobrando o papel…</span></div>
<noscript>Este livro precisa de JavaScript e WebGL para ficar em pé.</noscript>
